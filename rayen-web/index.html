<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11150F" />
    <meta name="description" content="A quiet record of the plants in your care." />
    <title>Rayen</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      ADDED TO THE HOME SCREEN THIS IS A STANDALONE APP, and that is not decoration.
      iOS clears a site's localStorage and IndexedDB after seven days without a visit,
      and a watering app is exactly the thing you might not open for ten. WebKit exempts
      the first-party domain of a home screen web app from that sweep, so installing it
      is what keeps a garden from quietly emptying itself.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rayen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Public+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      crossorigin
    />
    <style>
      html, body { margin: 0; height: 100%; background: #11150f; overscroll-behavior: none; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/deck/main.tsx"></script>
  </body>
</html>
