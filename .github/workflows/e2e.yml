# Maestro end-to-end tests on an Android emulator.
#
# This is manual-only (workflow_dispatch) so it never blocks PRs — E2E needs a
# built binary and a booted emulator, which is slow and has prerequisites that
# this repo doesn't satisfy yet:
#
# Prerequisites are now satisfied: app.json sets expo.android.package and the
# appId in .maestro/*.yaml matches it (both landed with the rename, D9). The flows
# themselves have still never been executed against a real build — see status/TASKS.md.
#
# This workflow builds a debug APK, installs it on an emulator, and runs every
# flow in .maestro/.
name: E2E (Maestro)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: juniper-app

jobs:
  maestro:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juniper-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner ships ~30GB of toolchains this job never touches, and the first two
      # attempts at this workflow both ran the disk to 100%. None of the paths below are
      # needed to build an Android APK. Best-effort: a failed rm must not fail the job.
      - name: Free unrelated toolchains
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift \
                      /usr/local/lib/node_modules/npm/node_modules/node-gyp 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "after:  $(df -h / | tail -1)"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The first run of this workflow died here with "No space left on device" while
      # unpacking the emulator; the second died because a plain `rm -rf` of the Gradle
      # caches raced the daemon still releasing files ("Directory not empty") and
      # bash -e killed the job over it.
      #
      # Cleanup is best-effort, and the step is judged on the thing that actually
      # matters — whether there is room for the emulator image — not on whether every
      # individual rm succeeded.
      #
      # Runs AFTER the APK is built on purpose: the NDK and the Gradle caches are only
      # safe to remove once their product is on disk.
      - name: Reclaim disk space before booting the emulator
        run: |
          echo "before: $(df -h / | tail -1)"

          ./android/gradlew --stop || true
          sleep 3   # let the daemon actually exit before deleting what it was holding
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/daemon 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/cmake 2>/dev/null || true

          echo "after:  $(df -h / | tail -1)"

          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "${avail}G available"
          if [ "${avail:-0}" -lt 12 ]; then
            echo "::error::Only ${avail}G free. The API-34 emulator image needs more than that."
            exit 1
          fi

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r juniper-app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test juniper-app/.maestro/

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
