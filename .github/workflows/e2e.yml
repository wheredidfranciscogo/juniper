# Maestro end-to-end tests on an Android emulator.
#
# Manual-only (workflow_dispatch) so it never blocks PRs — it needs a built binary and
# a booted emulator, which is slow.
#
# SPLIT INTO TWO JOBS on purpose. The single-job version failed three times in a row and
# never executed a single assertion:
#
#   1. "No space left on device" unpacking the emulator — npm ci, expo prebuild and the
#      Gradle build had already filled the runner's 72G disk.
#   2. A racy `rm -rf` of the Gradle caches ("Directory not empty") killed the job under
#      `bash -e`, before the emulator booted.
#   3. The 45-minute job timeout fired while the emulator was STILL booting: the build
#      had consumed ~35 minutes and an unaccelerated emulator needs 10+ on its own.
#
# Splitting fixes all three at once. Each job gets its own fresh disk, so the emulator
# job never competes with Gradle for space; each gets its own timeout budget; and the
# APK crosses between them as an artifact instead of being rebuilt. KVM is enabled and
# the AVD is cached, which is the difference between an emulator that boots in a minute
# and one that boots in fifteen.
name: E2E (Maestro)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: juniper-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juniper-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner ships ~15G of toolchains this job never touches. Best-effort: a
      # failed rm must not fail the job.
      - name: Free unrelated toolchains
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "after:  $(df -h / | tail -1)"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # RELEASE, not debug. `expo-dev-client` is a dependency (it is what makes the EAS
      # development builds work), and in a DEBUG build it takes over the launch entirely:
      # the app boots into the dev-launcher screen — "Start a local development server
      # with: npx expo start" — and waits for a Metro server that does not exist on CI.
      # That is exactly how the first real Maestro run failed, 5/5 flows at the very
      # first assertion, with a screenshot of the launcher to prove it.
      #
      # Release excludes the dev launcher and embeds the JS bundle, so the APK is
      # genuinely standalone. No signing setup needed: Expo's generated build.gradle
      # signs release with the debug keystore by default.
      - name: Build release APK
        run: ./android/gradlew -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: juniper-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Maestro on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Only the flow files are needed here — the APK arrives as an artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      # Without this the emulator falls back to software rendering and takes 10+ minutes
      # to boot, which is what blew the timeout on the previous attempt.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel6

      # First run only: create and snapshot the AVD without running anything, so every
      # later run boots from the snapshot instead of a cold start.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD snapshot created."

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apk/app-release.apk
            maestro test --format junit --output maestro-report.xml juniper-app/.maestro/

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: |
            maestro-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
