# Maestro end-to-end tests on an Android emulator.
#
# This is manual-only (workflow_dispatch) so it never blocks PRs — E2E needs a
# built binary and a booted emulator, which is slow and has prerequisites that
# this repo doesn't satisfy yet:
#
# Prerequisites are now satisfied: app.json sets expo.android.package and the
# appId in .maestro/*.yaml matches it (both landed with the rename, D9). The flows
# themselves have still never been executed against a real build — see status/TASKS.md.
#
# This workflow builds a debug APK, installs it on an emulator, and runs every
# flow in .maestro/.
name: E2E (Maestro)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: juniper-app

jobs:
  maestro:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juniper-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The first real run of this workflow died here with "No space left on device"
      # while unpacking the emulator: npm ci, expo prebuild and the Gradle build had
      # already consumed the runner's disk, and the emulator plus its API-34 system
      # image needs several GB more.
      #
      # This runs AFTER the APK is built on purpose — everything removed below is
      # either a toolchain the build no longer needs, or a Gradle cache whose only
      # product (the APK) is already on disk. Removing the NDK before the build would
      # be a different and much worse idea.
      - name: Reclaim disk space before booting the emulator
        run: |
          echo "before:"; df -h / | tail -1
          ./android/gradlew --stop || true
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/daemon
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r juniper-app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test juniper-app/.maestro/

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
