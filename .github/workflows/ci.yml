name: CI

# Lives at the repository root — GitHub only reads workflows from /.github/workflows,
# and this file used to sit inside juniper-app/, which stopped working the moment the
# three repos were collapsed into one (DECISIONS.md D4). Every step therefore runs with
# juniper-app as its working directory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: juniper-app

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juniper-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit & component tests
        run: npm run test:ci

      - name: Verify the iOS bundle builds
        # Catches broken imports, missing screens, and route-resolution issues that
        # unit tests miss. This was `--platform web` until the web target was dropped
        # (D1); iOS is now the canonical bundle check.
        run: npx expo export --platform ios --output-dir /tmp/expo-export

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: juniper-app/coverage/
          if-no-files-found: ignore
