name: CI

# Lives at the repository root — GitHub only reads workflows from /.github/workflows.
# Every step runs with rayen-web as its working directory, which is the only thing
# left that builds: the native app was frozen when Juniper became a web app
# (DECISIONS.md D13) and then removed, and the e2e workflow went with it, being
# Maestro against an Android binary that is no longer produced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: rayen-web

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rayen-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      - name: Check the static site
        # /about, /guides and /privacy are plain HTML. This is what stops a dead link or a
        # page missing from the sitemap from shipping unnoticed.
        run: npm run check:site

      - name: Verify both pages build
        # The deck is index.html and the grid is grid.html, and a build that takes only
        # one of them has happened before — it shipped a production deploy with no deck
        # in it. This is the step that would have caught it.
        run: npm run build
