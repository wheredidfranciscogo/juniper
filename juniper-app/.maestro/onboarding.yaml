# E2E: first-run splash -> 5 onboarding questions -> name -> reveal -> Today.
#
# This is the base flow; the others start with `runFlow: onboarding.yaml` to reach a
# seeded Today screen. It begins with `clearState`, so every flow starts from a genuine
# first install rather than inheriting whatever the previous one left behind.
#
# HOW TO RUN
#   CI:    the "E2E (Maestro)" workflow (workflow_dispatch) builds a debug APK, boots an
#          emulator, and runs everything in this folder. That is the supported path.
#   Local: needs a booted simulator/emulator and a real build — Maestro drives an
#          installed binary, so it cannot run under jest.
#            brew install maestro
#            npx expo run:android          (or run:ios)
#            maestro test .maestro/
#
# Testing inside Expo Go instead of a dev build? Use appId: host.exp.Exponent.
appId: com.wheredidfranciscogo.juniper
tags:
  - onboarding
---
- clearState
- launchApp

- assertVisible: "tap anywhere to begin"
- tapOn: "tap anywhere to begin"

- assertVisible: "What kind of plants do you tend to?"
- tapOn: "Houseplants"

- assertVisible: "How does your home receive light?"
- tapOn: "Bright most of the day"

- assertVisible: "How much time can you give them?"
- tapOn: "Twenty minutes a week"

- assertVisible: "What draws you to plants?"
- tapOn: "The calm of caring"

- assertVisible: "Where have you tended plants before?"
- tapOn: "Always"

- assertVisible: "And what should we call you?"
- inputText: "June"
- hideKeyboard
- tapOn: "Continue"

# Archetype reveal. The answers above map to The Plant Whisperer via pickArchetype().
- assertVisible: "Begin"
- tapOn: "Begin"

# Landed on Today with the seeded garden. Marcel is seeded 8 days since water on a
# 7-day cadence, so he is thirsty the moment onboarding finishes.
- assertVisible: "Water Marcel"
