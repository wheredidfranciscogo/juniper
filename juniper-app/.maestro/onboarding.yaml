# E2E: first-run splash -> 5 onboarding questions -> name -> reveal -> Today.
#
# Maestro drives a real build on a simulator/emulator, so it cannot run in this
# headless container or in plain `jest`. To run locally:
#   1. brew install maestro            (or: curl -Ls https://get.maestro.mobile.dev | bash)
#   2. Build & install the app on a booted device:  npx expo run:ios   (or run:android)
#   3. Set `appId` below to that build's bundle id / package name.
#   4. maestro test .maestro/onboarding.yaml
#
# If you test inside Expo Go instead of a dev build, use appId: host.exp.Exponent.
appId: com.jungle.app
tags:
  - onboarding
---
- clearState
- launchApp
- assertVisible: "tap anywhere to begin"
- tapOn: "tap anywhere to begin"

- assertVisible: "What kind of plants do you tend to?"
- tapOn: "Houseplants"

- assertVisible: "How does your home receive light?"
- tapOn: "Bright most of the day"

- assertVisible: "How much time can you give them?"
- tapOn: "Twenty minutes a week"

- assertVisible: "What draws you to plants?"
- tapOn: "The calm of caring"

- assertVisible: "Where have you tended plants before?"
- tapOn: "Always"

- assertVisible: "And what should we call you?"
- inputText: "June"
- tapOn: "Continue"

- assertVisible: "Begin"
- tapOn: "Begin"

# Landed on Today with the seeded garden (Marcel is overdue for water).
- assertVisible: "Water Marcel"
