# E2E: adding a plant by hand, and finding its square in the garden afterwards.
#
# Only the manual path is driven here. The photo path opens the camera and the search
# path needs a Perenual API key and a network round-trip — neither belongs in a flow
# that has to pass deterministically on a cold emulator. Both are covered by unit tests
# (edit.test.tsx, perenual.test.ts).
#
# REWRITTEN 2026-11-07 for the grid (DECISIONS.md D12): saving still redirects to
# /garden, but the garden is now squares with no title and no Thirsty filter, so the
# assertions moved to the count line and the tile's spoken label.
appId: com.wheredidfranciscogo.juniper
tags:
  - add
---
- runFlow: onboarding.yaml

- tapOn:
    id: "tab-add"
- assertVisible: "WELCOME THE NEW ONE"
- tapOn: "Add manually"

- assertVisible: "Name"
- tapOn: "Marcel"          # the Name field's placeholder
- inputText: "Fernando"
- hideKeyboard

- tapOn: "Monstera deliciosa"   # the Species field's placeholder
- inputText: "Nephrolepis exaltata"
- hideKeyboard

- tapOn: "Save"

# Saving redirects to the Garden, where the new plant gets its own square.
- assertVisible: "2 plants in your care · 1 ready for water"
- assertVisible: "Fernando"

# A plant added today counts as watered today, so its first watering is a full cadence
# away: its square shows a tick rather than a drop, and it is not what the count line
# is referring to — Marcel is, and he is still the only one due.
- assertVisible: "Fernando was watered today"
- assertVisible: "Marcel, due for water"

# It persists across a relaunch — the store is the only copy there is.
- launchApp
- assertVisible: "Fernando"
- assertVisible: "2 plants in your care"
