# E2E: the signature interaction — watering a plant from the Garden grid.
#
# This is the flow that matters most: the watering loop IS the product (DECISIONS.md D7).
# It guards two bugs that survived for months because nothing exercised them:
#
#   1. `daysSinceWater` was a stored counter nothing ever incremented, so watering a
#      plant set it to 0 and it could never become thirsty again. Watering now moves a
#      real timestamp, which is what makes the assertions below mean anything.
#   2. Photographs were stored and never shown anywhere the plant appeared, so a tile
#      could not have had a picture at all.
#
# REWRITTEN 2026-11-07 for the grid (DECISIONS.md D12). The Today tab it used to drive
# no longer exists; watering now happens from a square's own drop, without leaving the
# screen, and the square's colour is the feedback. Colour is not assertable, so this
# leans on the count line and the tile's accessibility label, which both state the same
# thing in words — which is exactly why the tile carries one.
appId: com.wheredidfranciscogo.juniper
tags:
  - water
---
- runFlow: onboarding.yaml

# Marcel is seeded 8 days since water on a 7-day cadence -> due.
- assertVisible: "1 plant in your care · 1 ready for water"
- assertVisible: "Marcel, due for water"

# Water him from the grid, without opening him.
- tapOn: "Water Marcel"
- assertVisible: "Marcel was watered today"

# The count line is derived from the same timestamp, so it must drop the ready-for-water
# clause entirely rather than just restyling the tile.
- assertVisible: "1 plant in your care"
- assertNotVisible: "1 ready for water"
- assertVisible: "Marcel, 7 days to go"

# It survives a relaunch, which is the real test of persistence — the store is the only
# copy there is.
- launchApp
- assertVisible: "Marcel was watered today"
- assertNotVisible: "1 ready for water"

# Opening the square expands it in place, and the full record is one tap further in.
- tapOn: "Marcel, 7 days to go"
- assertVisible: "Watered today"
- assertVisible: "Last watered today."
- tapOn: "The full record"
- assertVisible: "A SLOW RECORD"
