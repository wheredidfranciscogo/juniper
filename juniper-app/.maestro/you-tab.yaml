# E2E: the You tab — garden stats, the reminder controls, and the data section.
#
# SCOPE NOTE: this flow deliberately stops at the edge of the OS.
#
# Turning reminders on raises the system notification prompt, "Save a copy" opens the
# share sheet, and adding a photo opens the camera or the library. Driving those means
# tapping OS chrome whose wording and layout change between Android versions — flaky
# tests that mostly prove the OS still has buttons. The decision logic behind all three
# is unit-tested instead (notifications.test.ts, backup.test.ts, photos.test.ts, and
# you.test.tsx for the screen states), where permission-denied and revoked-after-the-fact
# can actually be simulated.
#
# What this flow does prove: the controls exist, are reachable, and render honestly
# before anything is granted.
#
# See onboarding.yaml for how to run these.
appId: com.wheredidfranciscogo.juniper
tags:
  - you
---
- runFlow: onboarding.yaml

- tapOn:
    id: "tab-you"

# Stats card, derived from the seeded garden — one lived-in example plant.
#
# UPDATED 2026-11-07. This block used to assert "YOU ARE" / "The Plant Whisperer" and
# "PLANT-DAYS", all three of which were deleted in afe7898 back in August (D11), and
# "6 plants", which stopped being true when the seed was cut to one. The flow had been
# asserting on an app that no longer existed for months, because the Maestro suite has
# still never been executed.
- assertVisible: "YOUR GARDEN"
- assertVisible: "IN YOUR CARE"
- assertVisible: "1 plant"
- assertVisible: "LONGEST TENDED"

# Reminders start off, and the copy says so rather than implying they are running.
- assertVisible: "REMINDERS"
- assertVisible: "Tell me when to water"
- assertVisible: "Off. Juniper will keep the record, but stay silent."

# Backup is reachable, and is explicit that Juniper is not the one uploading anything.
# "Save a copy" / "Restore from a copy" were renamed to say what they do (afe7898).
- assertVisible: "YOUR DATA"
- assertVisible: "Export your data"
- assertVisible: "Import a previous export"
- assertVisible: "you choose where it goes"

# The privacy claim is on the screen itself, not only on the website.
- assertVisible: "ABOUT"
- assertVisible: "No account, no server, nothing uploaded."
